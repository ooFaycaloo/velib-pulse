# Pile complète en local : Redpanda (compatible Kafka) → ClickHouse → dbt, plus le producteur sur le flux réel.
#   docker compose up -d                 # démarre Redpanda, ClickHouse, la console et le producteur
#   make dbt                             # construit les marts dbt (depuis la machine hôte)
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container          # création automatique des topics, ressources réduites
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      retries: 10

  console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on: [redpanda]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-velib}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123"]
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro     # 01 : tables brutes, 02 : ingestion Kafka
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    depends_on:
      redpanda: {condition: service_healthy}

  producer:
    build: .
    command: ["python", "-m", "velib_pulse.producer", "--source", "live", "--sink", "kafka", "--interval", "60"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
    restart: unless-stopped
    depends_on:
      redpanda: {condition: service_healthy}

volumes:
  clickhouse-data:
